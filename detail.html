<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Utopia Laundromat</title>
<link rel="icon" href="images/logo.jpg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap');
:root{--ink:#141412;--paper:#faf7f1;--blue:#1b3fcc;--line:rgba(20,20,18,.14);--muted:#837c70;--serif:Fraunces,'Noto Serif SC',serif;--sans:Archivo,'Microsoft YaHei',sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}.page{max-width:1240px;margin:auto;padding:18px clamp(20px,5vw,68px) 80px}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--line);border-radius:999px;padding:8px 10px 8px 16px;background:rgba(255,253,249,.87);position:sticky;top:14px;z-index:2;backdrop-filter:blur(16px)}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:14px;letter-spacing:.04em}.brand img{width:36px;height:36px;border-radius:50%;object-fit:cover}.back{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:11px 18px;font:700 13px var(--sans);cursor:pointer}.back:hover{background:var(--blue)}.hero{position:relative;display:grid;grid-template-columns:1.05fr .95fr;min-height:500px;align-items:end;padding:clamp(70px,10vw,130px) 0 42px;gap:40px;overflow:hidden}.hero:before{content:'';position:absolute;z-index:-1;width:380px;height:380px;border-radius:50%;right:11%;top:22%;background:radial-gradient(circle,rgba(45,109,216,.22),transparent 67%);filter:blur(3px)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--blue)}h1{font:500 clamp(52px,7vw,102px)/.95 var(--serif);letter-spacing:-.045em;margin:16px 0 20px}h1 em{font-style:italic;color:var(--blue);font-weight:400}.intro{font-size:clamp(17px,2vw,21px);max-width:560px;color:#494842}.image-wrap{height:440px;overflow:hidden;border-radius:28px;position:relative;box-shadow:0 35px 70px -40px rgba(0,0,0,.5)}.image-wrap img{width:100%;height:100%;object-fit:cover}.image-wrap:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.32))}.caption{position:absolute;bottom:20px;left:22px;color:#fff;font-size:12px;letter-spacing:.14em;text-transform:uppercase;z-index:1}.info{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--line);margin-top:18px}.info div{padding:24px 18px;border-left:1px solid var(--line)}.info div:first-child{border-left:0}.info b{display:block;font:500 clamp(24px,3vw,38px)/1.1 var(--serif)}.info span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.18em;text-transform:uppercase}.detail{max-width:900px;margin:clamp(70px,10vw,130px) auto 0;border-top:1px solid var(--ink);padding-top:22px}.detail h2{font:500 clamp(32px,5vw,56px)/1.05 var(--serif);letter-spacing:-.025em;margin:0 0 24px}.detail p{font-size:17px;color:#484742}.grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-top:30px}.card{padding:28px;border-left:1px solid var(--line);min-height:165px}.card:first-child{border-left:0}.card .num{font:400 23px var(--serif);font-style:italic;color:var(--blue)}.card h3{font:500 24px/1.15 var(--serif);margin:12px 0 7px}.card p{font-size:14px;margin:0}.numbers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:28px}.numbers b{display:grid;place-items:center;border-radius:16px;background:var(--ink);color:#fff;min-height:74px;font:500 clamp(24px,4vw,40px) var(--serif)}.rules{margin:30px 0;padding:0;list-style:none}.rules li{border-top:1px solid var(--line);padding:16px 0;font-size:16px}.rules li:before{content:'◆';color:var(--blue);font-size:11px;margin-right:12px}.callout{background:var(--ink);color:#fff;border-radius:24px;padding:32px;margin-top:34px}.callout p{color:rgba(255,255,255,.72);margin:0 0 17px}.callout a{display:inline-block;background:#fff;color:var(--ink);border-radius:999px;padding:12px 18px;font-weight:800;text-decoration:none}.fade{animation:fade .75s cubic-bezier(.2,.7,.2,1) both}@keyframes fade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@media(max-width:720px){.hero{grid-template-columns:1fr;padding-top:72px;gap:26px}.image-wrap{height:280px;order:-1}.info{grid-template-columns:1fr}.info div{border-left:0;border-top:1px solid var(--line)}.info div:first-child{border-top:0}.grid{grid-template-columns:1fr}.card{border-left:0;border-top:1px solid var(--line)}.card:first-child{border-top:0}.numbers{grid-template-columns:1fr 1fr}.brand span{display:none}}
</style>
</head>
<body>
<main class="page fade">
  <header class="bar"><a class="brand" href="home.html"><img src="images/logo.jpg" alt="Utopia Laundromat"><span>UTOPIA · WHITESTONE</span></a><button class="back" onclick="goBack()">← Back to Utopia</button></header>
  <section class="hero"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="intro" id="intro"></p></div><div class="image-wrap"><img id="photo" alt=""><span class="caption">Utopia Laundromat · Whitestone, NY</span></div></section>
  <section class="info" id="facts"></section>
  <article class="detail"><h2 id="heading"></h2><p id="copy"></p><div id="content"></div><div class="callout"><p>Questions? We are here seven days a week.</p><a href="tel:7183527622">Call 718-352-7622</a></div></article>
</main>
<script>
const topics={
 'self-service':{eyebrow:'01 / SERVICE',title:'Self-service<br><em>laundry.</em>',intro:'Fast, clean coin-operated machines in a bright neighborhood store.',image:'3.jpg',facts:[['$3–8.25','Washers'],['$0.25','Dryer / 6 min'],['7 days','Open weekly']],heading:'Choose your pace.',copy:'Walk in during business hours, choose the washer size that fits your load, and wash on your own schedule.',cards:[['Small washer','$3.00 per wash'],['Medium washer','$6.00 per wash'],['Large washer','$8.25 per wash']]},
 dropoff:{eyebrow:'02 / SERVICE',title:'Wash, dry<br><em>& fold.</em>',intro:'Leave the laundry with us and pick it up fresh, folded, and ready.',image:'4.jpg',facts:[['$1.10','Per pound'],['10 lbs','Minimum'],['Same day','Available']],heading:'Four simple steps.',copy:'Bring it in, receive your price, and let our team sort, wash, dry and fold everything. Shirts are returned on hangers.',cards:[['01 / Bring it in','We weigh your order and quote it right away.'],['02 / We handle it','Sorted, washed, dried and neatly folded.'],['03 / Pick it up','Same-day pickup is available for qualifying orders.']]},
 'dry-cleaning':{eyebrow:'03 / SERVICE',title:'Care for<br><em>the delicate.</em>',intro:'Professional dry cleaning for the pieces that need extra care.',image:'5.jpg',facts:[['From $4.50','Per item'],['Suits','Coats · dresses'],['Ask us','About special items']],heading:'Detail matters.',copy:'Bring in suits, coats, dresses and delicate garments. We will help you choose the right care for each piece.',cards:[['Suits','Professional finishing for your everyday formalwear.'],['Outerwear','Care for coats and seasonal layers.'],['Delicates','Thoughtful treatment for special fabrics.']]},
 lucky:{eyebrow:'STORE EVENT',title:'Lucky receipt<br><em>draw.</em>',intro:'Every drop-off order may bring a small surprise. Keep your receipt.',image:'8.jpg',facts:[['8','Current numbers'],['More orders','More chances'],['Mystery gift','For selected winners']],heading:'Check your receipt.',copy:'If your drop-off receipt shows one of the current lucky numbers, you may be selected for a mystery gift. We notify winners by phone message.',numbers:['1888','2888','3888','4888','5888','6888','7888','8888'],rules:['Keep your receipt after every drop-off order.','When a complete group of numbers has appeared, a new group begins.','Please leave a current phone number with your drop-off order.','More drop-off orders mean more chances to win.']},
 gift:{eyebrow:'STORE UPDATE',title:'Give the gift<br><em>of time.</em>',intro:'Prepaid cards and gift certificates are available in store.',image:'7.jpg',facts:[['In store','Available now'],['Prepaid','Easy to reload'],['Gift cards','For any occasion']],heading:'A useful gift, ready when they are.',copy:'Ask our team about prepaid cards and gift certificates during your next visit. They are a simple way to make laundry easier for someone you care about.',cards:[['Prepaid cards','Convenient for your regular laundry routine.'],['Gift certificates','A practical gift for family, friends, or neighbors.'],['Ask in store','Our team can share the current options.']]},
 careers:{eyebrow:'JOIN OUR TEAM',title:'Work with<br><em>the community.</em>',intro:'We are looking for reliable people who care about service and a tidy store.',image:'10.jpg',facts:[['2','Current roles'],['English + Chinese','For laundry staff'],['Apply','By email or phone']],heading:'Current openings.',copy:'Interested in joining Utopia Laundromat? Call or email us to ask about current availability and application details.',cards:[['Laundry staff','1–2 years of laundry-industry experience. Fluent English and Chinese.'],['Flyer delivery staff','Comfortable with local directions and extended walking.']]}
};
const topic=topics[new URLSearchParams(location.search).get('topic')]||topics['self-service'];
document.title='Utopia Laundromat — '+topic.title.replace(/<[^>]+>/g,'');
eyebrow.textContent=topic.eyebrow;title.innerHTML=topic.title;intro.textContent=topic.intro;photo.src='images/'+topic.image;photo.alt=topic.heading;heading.textContent=topic.heading;copy.textContent=topic.copy;
facts.innerHTML=topic.facts.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
if(topic.numbers){content.innerHTML=`<div class="numbers">${topic.numbers.map(n=>`<b>${n}</b>`).join('')}</div><ul class="rules">${topic.rules.map(r=>`<li>${r}</li>`).join('')}</ul>`}else{content.innerHTML=`<div class="grid">${topic.cards.map((c,i)=>`<div class="card"><div class="num">0${i+1}</div><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div>`}
function goBack(){if(history.length>1)history.back();else location.href='home.html'}
</script>
</body>
</html>
